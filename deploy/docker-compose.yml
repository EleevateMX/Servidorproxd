# Próxima RP en un VPS Linux. Desde la raíz del repo:
#   cp deploy/.env.example deploy/.env   (y rellénalo)
#   docker compose -f deploy/docker-compose.yml up -d --build
# Bot de Discord (opcional, docs/11-discord.md): rellena discord/.env y añade --profile discord.
services:
  fxserver:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    env_file: .env
    ports:
      - "30120:30120/tcp"
      - "30120:30120/udp"
    volumes:
      # Layouts de props y registros del login sobreviven a reinicios y reconstrucciones.
      - props-data:/srv/server-data/resources/[proxima]/pxd_props/data
      - login-data:/srv/server-data/resources/[proxima]/pxd_login/data
    stdin_open: true
    tty: true
  discord-bot:
    profiles: ["discord"]
    build:
      context: ..
      dockerfile: discord/Dockerfile
    restart: unless-stopped
    env_file:
      - path: ../discord/.env
        required: false
    volumes:
      - discord-data:/app/discord/data
volumes:
  props-data:
  login-data:
  discord-data:
