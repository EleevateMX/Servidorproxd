# ─────────────────────────────────────────────────────────────────────────────
#  PRÓXIMA RP — ajustes propios (va en la carpeta del servidor, junto a server.cfg)
#  En server.cfg basta UNA línea, la ÚLTIMA del archivo:   exec proxima.cfg
#  Al ir al final, estos valores mandan sobre los anteriores. Sin secretos.
# ─────────────────────────────────────────────────────────────────────────────

# Versión de Próxima que descarga pxd_update (no sigue la rama: solo esta versión)
set pxd_updater_ref "228b90f9dc334b62fcf69e2c83c7e752cf4256d4"

# Controles (docs/28): I inventario · E maletero e interacción · B recoger · Ctrl agacharse · F1 barra rápida
setr inventory:keys ["I", "", "F1"]
setr inventory:screenblur false
setr scully_emotemenu:stanceKey ""
setr scully_emotemenu:pointKey ""

# Voz: radio con Bloq Mayús (Alt es la mirilla de ox_target); el modo lo muestra pxd_hud
setr voice_defaultRadio "CAPITAL"
setr voice_enableUi 0

# Chat: sin avisos de entrada/salida y sin el motd de qbx (la bienvenida la da pxd_chat)
set chat_showJoins 0
set chat_showQuits 0
setr qbx:motd ""

# Editor de ropa en español
setr illenium-appearance:locale "es-ES"

# Interfaces de ox_lib y ox_target con el tema de Próxima (pxd_theme; docs/24)
setr ox:primaryColor cyan
setr ox:primaryShade 5
# Avisos de txAdmin con el estilo de ox_lib (activa también «Hide default announcement/DM/warning» en txAdmin → Settings → Game)
set ox:txAdminNotifications 1
