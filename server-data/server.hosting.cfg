# ─────────────────────────────────────────────────────────────────────────────
#  PRÓXIMA RP — configuración para hosting con txAdmin (la instala recipe.yaml)
#  Las variables entre llaves dobles las rellena txAdmin al desplegar. Guía: docs/07-hosting-oficial.md
# ─────────────────────────────────────────────────────────────────────────────

{{serverEndpoints}}
sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}

sv_hostname "{{serverName}}"
sets sv_projectName "Próxima RP | Latam"
sets sv_projectDesc "Rol en español para toda Latinoamérica. Vive tu historia en Los Santos y compite en modos de juego."
sets locale "es-ES"
sets tags "roleplay, español, latinoamerica, latam, modos de juego"

# Obligatorio para los modos de juego (routing buckets).
set onesync on

sv_scriptHookAllowed 0
setr sv_showBusySpinnerOnLoadingScreen false

# ── Secretos: edítalos en txAdmin → CFG Editor (usa `set`, nunca `setr`) ─────
# Dashboard web de props y comando pxd: pon un token de 24+ caracteres para activarlo.
set pxd_props_webToken ""
# Código de acceso al conectar (vacío = servidor abierto).
set pxd_login_accessCode ""
# Tienda Tebex: quita el # y pega la clave secreta de Tebex (Integrations → Game Servers).
#sv_tebexSecret "PEGA_AQUI_TU_CLAVE_DE_TEBEX"

# ── Permisos ─────────────────────────────────────────────────────────────────
exec permissions.cfg
# Admin principal de txAdmin (añadido por el instalador):
{{addPrincipalsMaster}}

# ── Base: chat viene incluido en FXServer; el resto sale de cfx-server-data ──
ensure mapmanager
ensure chat
ensure spawnmanager
ensure basic-gamemode
ensure baseevents
ensure fivem-map-hipster

# ── Próxima RP ───────────────────────────────────────────────────────────────
ensure pxd_loadscreen
ensure pxd_login
ensure pxd_props
ensure pxd_gamemodes
