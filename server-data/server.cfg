# ─────────────────────────────────────────────────────────────────────────────
#  PRÓXIMA RP — servidor de PRUEBAS (entorno local para crear modos de juego)
#  Guía: docs/02-entorno-de-pruebas.md
#  Los secretos (licencia, contraseñas, tokens) van en secrets.cfg, que NO se versiona.
# ─────────────────────────────────────────────────────────────────────────────

endpoint_add_tcp "0.0.0.0:30120"
endpoint_add_udp "0.0.0.0:30120"

sv_hostname "Próxima RP · Pruebas"
sets sv_projectName "Próxima RP"
sets sv_projectDesc "Entorno de pruebas de modos de juego"
sets locale "es-ES"
sv_maxclients 8

# OneSync es obligatorio: los routing buckets de los modos de juego lo necesitan.
set onesync on

# Build del juego. En FiveM for GTAV Enhanced se usa la última por defecto.
# En FiveM Legacy puedes fijar una (ver docs/01-investigacion.md §Builds):
#sv_enforceGameBuild 3751

sv_scriptHookAllowed 0
setr sv_showBusySpinnerOnLoadingScreen false

# Secretos y permisos
exec secrets.cfg
exec permissions.cfg

# ── Base de cfx-server-data (la descarga scripts/setup-*) ────────────────────
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure baseevents
ensure fivem-map-hipster

# ── Próxima RP ───────────────────────────────────────────────────────────────
ensure pxd_loadscreen
ensure pxd_login
ensure pxd_props
ensure pxd_gamemodes
