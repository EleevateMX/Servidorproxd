# ─────────────────────────────────────────────────────────────────────────────
#  PRÓXIMA RP + QBOX — server.cfg (lo instala recipe-qbox.yaml)
#  Basado en el server.cfg de la receta oficial de Qbox (Qbox-project/txAdminRecipe).
#  Nombre, descripción, idioma, etiquetas y banners: en portal.cfx.re.
# ─────────────────────────────────────────────────────────────────────────────

sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
set mysql_connection_string "{{dbConnectionString}}"
{{serverEndpoints}}

sv_enforceGameBuild 3258
set steam_webApiKey "none"

# Chat (chat del sistema de FXServer)
set resources_useSystemChat true
set qbx_chat:joinMessage "^2%s entró a la ciudad"
set qbx_chat:quitMessage "^1%s salió de la ciudad (%s)"

# Voz
exec voice.cfg

## Qbox
setr qb_locale "es"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/qUcD5gCf6v"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"

# Mensaje al entrar
setr qbx:motd "<p style='padding: 1rem; background-color: #0a0f1f; border: 1px solid #1c2647; border-radius: 0.5rem; text-align: center;'><span style='color: #5ce1ff;'>Bienvenido/a a Próxima RP</span><br>F7 abre los modos de juego · /salirmodo para volver a la ciudad</p>"

setr illenium-appearance:locale "en"
setr weather_disablecd true

# ox (ox_lib, ox_target, ox_inventory)
exec ox.cfg
# TAB abre el panel de Próxima (pxd_panel): el inventario pasa a F2 (K maletero, F1 barra rápida).
setr inventory:keys ["F2", "K", "F1"]

# Teléfono (NPWD)
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# OneSync: obligatorio para Qbox y para los modos de juego
set onesync on
setr sv_showBusySpinnerOnLoadingScreen false

# ── Secretos de Próxima (usa `set`, nunca `setr`) ────────────────────────────
set pxd_props_webToken ""
set pxd_login_accessCode ""
#sv_tebexSecret "PEGA_AQUI_TU_CLAVE_DE_TEBEX"

# ── Recursos ─────────────────────────────────────────────────────────────────
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure [assets]

ensure [npwd-apps]
ensure qbx_npwd
ensure npwd

# Próxima RP (después de Qbox)
ensure pxd_loadscreen
ensure pxd_login
ensure pxd_props
ensure pxd_gamemodes
ensure pxd_progress
ensure pxd_multichar
ensure pxd_restart
ensure pxd_jobs
ensure pxd_panel
ensure pxd_hud
ensure pxd_updater

## Permisos
{{addPrincipalsMaster}}
exec permissions.cfg
exec permissions.pxd.cfg

## Varios
exec misc.cfg
