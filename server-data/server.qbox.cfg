# ─────────────────────────────────────────────────────────────────────────────
#  PRÓXIMA RP + QBOX — server.cfg (lo instala recipe-qbox.yaml)
#  Basado en el server.cfg de la receta oficial de Qbox (Qbox-project/txAdminRecipe).
#  Nombre, descripción, idioma, etiquetas y banners: en portal.cfx.re.
# ─────────────────────────────────────────────────────────────────────────────

sv_licenseKey "{{svLicense}}"
sv_maxclients {{maxClients}}
set mysql_connection_string "{{dbConnectionString}}"
{{serverEndpoints}}

# Misma build que los grandes servidores: 3751 («A Safehouse in the Hills»).
sv_enforceGameBuild 3751

## Ficha del servidor en FiveM (docs/16-ficha-fivem.md)
sets Discord "discord.gg/qUcD5gCf6v"
# Publicaciones en la ficha (pestaña «Feed»): crea la cuenta y quita el «#».
# sets activitypubFeed "proximarp@fivem.social"
set steam_webApiKey "none"

# Chat (chat del sistema de FXServer)
set resources_useSystemChat true
# Sin avisos de entrada/salida en el chat (chat del sistema: chat_showJoins / chat_showQuits).
set chat_showJoins 0
set chat_showQuits 0

# Voz
exec voice.cfg
# Próxima: la radio se habla con Bloq Mayús (Alt la usa la mirilla de ox_target)
setr voice_defaultRadio "CAPITAL"
# El modo de voz ya lo muestra pxd_hud: sin la interfaz propia de pma-voice
setr voice_enableUi 0

## Qbox
setr qb_locale "es"
setr qbx:enableBridge "true"
set qbx:enableQueue "true"
set qbx:bucketLockdownMode "inactive"
set qbx:discordLink "discord.gg/qUcD5gCf6v"
set qbx:max_jobs_per_player 1
set qbx:max_gangs_per_player 1
set qbx:setjob_replaces "true"
set qbx:setgang_replaces "true"
set qbx:cleanPlayerGroups "true"
set qbx:allowMethodOverrides "true"
set qbx:disableOverrideWarning "false"
setr qbx:enableVehiclePersistence "false"
setr qbx:vehiclePersistenceType "semi"
set qbx:acknowledge "false"
setr qbx:enableGroupManagement "false"

# Mensaje al entrar
# Sin qbx:motd: salía repetido. La bienvenida la da pxd_chat una sola vez por sesión.
# (Ojo: `set X ""` con texto vacío da «Argument count mismatch» en la consola.)

setr illenium-appearance:locale "es-ES"
setr weather_disablecd true

# ox (ox_lib, ox_target, ox_inventory)
exec ox.cfg
# TAB panel · I inventario · E maletero e interacción · B recoger del suelo · F1 barra rápida (docs/28).
setr inventory:keys ["I", "", "F1"]
# Ctrl izquierdo agacharse (pxd_interact) y B recoger: scully no usa esas teclas
setr scully_emotemenu:stanceKey ""
setr scully_emotemenu:pointKey ""
# Sin el desenfoque de pantalla de ox_inventory: pxd_inventory enfoca al personaje
# con una cámara (fondo desenfocado y personaje nítido).
setr inventory:screenblur false

# Teléfono (NPWD)
set npwd:framework "qbx"
set SCREENSHOT_BASIC_TOKEN ""
set NPWD_AUDIO_TOKEN ""

# OneSync: obligatorio para Qbox y para los modos de juego
set onesync on
setr sv_showBusySpinnerOnLoadingScreen false

# ── Secretos de Próxima (usa `set`, nunca `setr`) ────────────────────────────
set pxd_props_webToken ""
set pxd_login_accessCode ""
#sv_tebexSecret "PEGA_AQUI_TU_CLAVE_DE_TEBEX"

# ── Recursos ─────────────────────────────────────────────────────────────────
ensure mapmanager
ensure chat
ensure spawnmanager
ensure baseevents

ensure ox_lib
ensure qbx_core
ensure ox_target
ensure [ox]
ensure [qbx]
ensure [standalone]
ensure [voice]
ensure pxd_voice

ensure [npwd-apps]
ensure qbx_npwd
ensure npwd
ensure pxd_phone

# Próxima RP (después de Qbox)
ensure pxd_loadscreen
ensure pxd_login
ensure pxd_props
ensure pxd_gamemodes
ensure pxd_progress
ensure pxd_justice
ensure pxd_multichar
ensure pxd_restart
ensure pxd_interact
ensure pxd_chat
ensure pxd_jobs
ensure pxd_compat
ensure pxd_admin
ensure pxd_panel
ensure pxd_hud
ensure pxd_inventory
ensure pxd_updater

## Permisos
{{addPrincipalsMaster}}
exec permissions.cfg
exec permissions.pxd.cfg

## Varios
exec misc.cfg
