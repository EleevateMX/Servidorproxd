<!doctype html>
<html lang="es" class="px">
<head>
  <meta charset="utf-8">
  <title>Panel — Próxima RP</title>
  <link rel="stylesheet" href="ui/proxima-fonts.css">
  <link rel="stylesheet" href="ui/proxima-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Avisos: visibles aunque el panel esté cerrado -->
  <div class="toasts" id="toasts" aria-live="polite"></div>

  <div class="shell hidden" id="shell">
    <div class="panel" role="dialog" aria-label="Panel de la ciudad">
      <aside class="side">
        <div class="brand">
          <img src="logo.svg" alt="Próxima RP" class="brand__logo">
        </div>
        <div class="online">
          <span class="online__dot" aria-hidden="true"></span>
          <div><b id="online">—</b><span id="online-max"></span><small>en la ciudad</small></div>
        </div>
        <nav class="nav" id="nav" aria-label="Secciones"></nav>
        <div class="side__foot">
          <button class="store hidden" id="store" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16l-1.5 11.5a2 2 0 0 1-2 1.5h-9a2 2 0 0 1-2-1.5zM8 7a4 4 0 0 1 8 0"/></svg>
            <span>Tienda</span>
          </button>
          <button class="discord" id="discord" type="button">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7c3-1.4 7-1.4 10 0l1.5 9c-1.4 1-3 1.7-4.3 2l-.9-1.6c-1.5.3-3.1.3-4.6 0L7.8 18c-1.4-.3-2.9-1-4.3-2zm2.3 5.6a1.3 1.4 0 1 0 0-.1zm5.4 0a1.3 1.4 0 1 0 0-.1z"/></svg>
            <span>Discord</span>
          </button>
        </div>
      </aside>

      <main class="main">
        <header class="main__head">
          <div>
            <p class="eyebrow" id="eyebrow"></p>
            <h1 id="title"></h1>
          </div>
          <button class="icon-btn" id="close" type="button" aria-label="Cerrar">
            <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
          </button>
        </header>
        <section class="view" id="view"></section>
      </main>
    </div>

    <div class="modal hidden" id="modal" role="alertdialog" aria-modal="true">
      <div class="modal__box">
        <h2 id="modal-title"></h2>
        <p id="modal-text"></p>
        <div class="modal__actions">
          <button class="btn btn--ghost" id="modal-cancel" type="button">Cancelar</button>
          <button class="btn btn--primary" id="modal-ok" type="button">Confirmar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
