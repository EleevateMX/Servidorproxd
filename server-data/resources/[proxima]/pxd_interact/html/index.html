<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Próxima RP — interacción</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Aviso contextual: «E · Recoger». Con varias opciones, lista navegable con la rueda. -->
  <section class="prompt hidden" id="prompt" aria-live="polite">
    <ol class="options" id="options"></ol>
    <p class="hint hidden" id="hint">Rueda o flechas para elegir</p>
  </section>
  <!-- Avisos cortos -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
