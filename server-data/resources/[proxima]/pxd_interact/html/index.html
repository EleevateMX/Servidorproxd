<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Próxima RP — interacción</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Aviso contextual: «E · Recoger». Con varias opciones, lista navegable con la rueda. -->
  <section class="prompt hidden" id="prompt" aria-live="polite">
    <ol class="options" id="options"></ol>
    <p class="hint hidden" id="hint">Rueda del ratón para elegir</p>
  </section>
  <!-- «B · Recoger …»: objeto del suelo más cercano -->
  <section class="pickup hidden" id="pickup" aria-live="polite">
    <span class="key key--pickup" id="pickup-key">B</span><span class="label" id="pickup-label"></span>
  </section>
  <!-- Avisos cortos -->
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
