<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Próxima RP</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fondo: cielo CSS siempre; encima vídeo e imágenes (assets/) en carrusel -->
  <div class="sky" aria-hidden="true">
    <div class="stars stars--a"></div>
    <div class="stars stars--b"></div>
    <div class="proxima-star"></div>
  </div>
  <video id="bg-video" class="layer" muted loop playsinline preload="auto"></video>
  <div id="slides" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <header class="top">
    <img class="logo" src="logo.svg" alt="Próxima RP">
  </header>

  <main class="hero">
    <p class="kicker" id="welcome"></p>
    <h1 class="tagline">Tu próxima vida<br>empieza aquí.</h1>
  </main>

  <!-- Bloque inferior izquierdo -->
  <section class="dock" aria-label="Información del servidor">
    <p class="online"><span class="pulse" aria-hidden="true"></span><b id="online">—</b> en línea</p>

    <article class="codex" id="codex" aria-live="polite">
      <div class="codex__head">
        <svg class="codex__star" viewBox="0 0 160 160" aria-hidden="true"><path d="M80 12 C85 62 98 75 148 80 C98 85 85 98 80 148 C75 98 62 85 12 80 C62 75 75 62 80 12Z"/></svg>
        <span id="codex-label">Código de la ciudad</span>
        <span class="codex__count" id="codex-count"></span>
      </div>
      <p class="codex__text" id="codex-text"></p>
      <div class="codex__bar"><span id="codex-bar"></span></div>
    </article>

    <div class="bar">
      <span class="radio"><span class="pulse pulse--small" aria-hidden="true"></span><span id="radio-name">PRÓXIMA FM</span></span>
      <button class="play" id="play" aria-label="Reproducir o pausar">
        <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
        <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
      </button>
      <svg viewBox="0 0 24 24" class="vol-icon" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4z"/></svg>
      <input id="volume" type="range" min="0" max="100" value="35" aria-label="Volumen">
      <button class="discord hidden" id="discord">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7c3-1.4 7-1.4 10 0l1.5 9c-1.4 1-3 1.7-4.3 2l-.9-1.6c-1.5.3-3.1.3-4.6 0L7.8 18c-1.4-.3-2.9-1-4.3-2zm2.3 5.6a1.3 1.4 0 1 0 0-.1zm5.4 0a1.3 1.4 0 1 0 0-.1z"/></svg>
        Discord
      </button>
      <nav class="socials" id="socials" aria-label="Redes"></nav>
    </div>
  </section>

  <!-- Inferior derecha: progreso -->
  <section class="progress" aria-label="Progreso de carga">
    <p class="status" id="status">Conectando con la ciudad…</p>
    <div class="ring-row">
      <svg class="ring" viewBox="0 0 40 40" aria-hidden="true">
        <circle cx="20" cy="20" r="16" class="ring__track"/>
        <circle cx="20" cy="20" r="16" class="ring__fill" id="ring"/>
      </svg>
      <span class="percent" id="percent" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">0%</span>
    </div>
    <p class="hint" id="hint"></p>
    <p class="tip" id="tip"></p>
  </section>

  <!-- Transición al cerrar -->
  <div class="transition" id="transition" aria-hidden="true">
    <div class="grid"></div>
    <svg class="spin-star" viewBox="0 0 160 160"><path d="M80 12 C85 62 98 75 148 80 C98 85 85 98 80 148 C75 98 62 85 12 80 C62 75 75 62 80 12Z"/></svg>
  </div>

  <audio id="voice" src="assets/bienvenida.mp3" preload="auto"></audio>
  <audio id="music" src="assets/music.mp3" preload="auto" loop></audio>
  <script src="app.js"></script>
</body>
</html>
