<!doctype html>
<html lang="es" class="px">
<head>
  <meta charset="utf-8">
  <title>Próxima RP — HUD</title>
  <link rel="stylesheet" href="ui/proxima-fonts.css">
  <link rel="stylesheet" href="ui/proxima-ui.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Iconos reutilizables -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-star" viewBox="0 0 160 160"><path d="M80 12 C85 62 98 75 148 80 C98 85 85 98 80 148 C75 98 62 85 12 80 C62 75 75 62 80 12Z"/></symbol>
    <symbol id="i-cash" viewBox="0 0 24 24"><path d="M3 6h18v12H3zM5 8v8h14V8zm7 1.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z"/></symbol>
    <symbol id="i-bank" viewBox="0 0 24 24"><path d="M12 3 2 8v2h20V8zM4 11h3v6H4zm6.5 0h3v6h-3zM17 11h3v6h-3zM2 18h20v3H2z"/></symbol>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.5 3 4.5 6.8 4.5c2.1 0 3.6 1.2 5.2 3 1.6-1.8 3.1-3 5.2-3 3.8 0 5.9 4 4.4 7.3C19.5 16.4 12 21 12 21z"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2 4 5v6c0 5 3.4 9.3 8 11 4.6-1.7 8-6 8-11V5z"/></symbol>
    <symbol id="i-food" viewBox="0 0 24 24"><path d="M7 2v7a2 2 0 0 1-1 1.7V22H4V10.7A2 2 0 0 1 3 9V2h1.5v6h1V2h1v6h1V2zm9 0c2.2 0 4 2.5 4 6.5 0 2.4-1 3.9-2.5 4.4V22h-2.5V2z"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2s-7 7.6-7 12.5a7 7 0 0 0 14 0C19 9.6 12 2 12 2z"/></symbol>
    <symbol id="i-brain" viewBox="0 0 24 24"><path d="M9 3a3 3 0 0 0-3 3 3 3 0 0 0-2 5 3 3 0 0 0 1 5 3 3 0 0 0 4 3 2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm6 0a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2 3 3 0 0 0 4-3 3 3 0 0 0 1-5 3 3 0 0 0-2-5 3 3 0 0 0-3-3z"/></symbol>
    <symbol id="i-bubble" viewBox="0 0 24 24"><path d="M8 14a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm8 6a3 3 0 1 1 0-6 3 3 0 0 1 0 6zm1-11a2 2 0 1 1 0-4 2 2 0 0 1 0 4z"/></symbol>
    <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.9V21h-2v-3.1A7 7 0 0 1 5 11z"/></symbol>
    <symbol id="i-radio" viewBox="0 0 24 24"><path d="M6 8 17 3l.7 1.8L10.5 8H20v13H4V8zm2 5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm6 0v1.5h4V13zm0 3v1.5h4V16z"/></symbol>
    <symbol id="i-fuel" viewBox="0 0 24 24"><path d="M4 3h9v8h1.5a2 2 0 0 1 2 2v4a1 1 0 0 0 2 0V9.4L16 7l1.4-1.4 3.1 3.1V17a3 3 0 0 1-6 0v-4H13v8H4zm2 2v5h5V5z"/></symbol>
    <symbol id="i-engine" viewBox="0 0 24 24"><path d="M7 5h6v2h-2v1h4l2 2h2v-2h2v8h-2v-2h-2v3h-3l-2 2H8v-3H6v2H4V9h2v2h1V8h2V7H7z"/></symbol>
    <symbol id="i-belt" viewBox="0 0 24 24"><path d="M12 2a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM8 8h8l1 6h-2l-.5 8h-5L9 14H7zm1.6 1.5 4.8 12h1.7L11.3 9.5z"/></symbol>
    <symbol id="i-cruise" viewBox="0 0 24 24"><path d="M12 4a9 9 0 0 1 9 9h-2a7 7 0 0 0-14 0H3a9 9 0 0 1 9-9zm4.6 3.9 1.4 1.4-4.6 4.6a2 2 0 1 1-1.4-1.4z"/></symbol>
  </svg>

  <div id="hud" class="hud is-hidden">
    <!-- Marco del minimapa + dinero encima -->
    <div class="map-frame" id="map-frame" aria-hidden="true">
      <span class="map-frame__star"><svg><use href="#i-star"/></svg></span>
    </div>

    <div class="wallet" id="wallet">
      <div class="wallet__item" title="Efectivo">
        <svg class="ic ic--cash"><use href="#i-cash"/></svg>
        <b id="cash">$0</b>
      </div>
      <span class="wallet__sep"></span>
      <div class="wallet__item" title="Banco">
        <svg class="ic ic--bank"><use href="#i-bank"/></svg>
        <b id="bank">$0</b>
      </div>
      <span class="wallet__delta" id="delta"></span>
    </div>

    <!-- Necesidades en una fila, entre el dinero y el minimapa -->
    <div class="vitals" id="vitals">
      <div class="stat" data-k="health"><svg class="ic"><use href="#i-heart"/></svg><i><span></span></i></div>
      <div class="stat" data-k="armor"><svg class="ic"><use href="#i-shield"/></svg><i><span></span></i></div>
      <div class="stat" data-k="hunger"><svg class="ic"><use href="#i-food"/></svg><i><span></span></i></div>
      <div class="stat" data-k="thirst"><svg class="ic"><use href="#i-drop"/></svg><i><span></span></i></div>
      <div class="stat" data-k="stress"><svg class="ic"><use href="#i-brain"/></svg><i><span></span></i></div>
      <div class="stat" data-k="oxygen"><svg class="ic"><use href="#i-bubble"/></svg><i><span></span></i></div>
    </div>

    <!-- Multas pendientes (pxd_justice): arriba a la derecha, solo si hay deuda -->
    <div class="fines" id="fines" title="Multas pendientes">
      <svg class="ic"><use href="#i-shield"/></svg><span>Multas:</span><b id="fines-amount">$0</b>
    </div>

    <!-- Fecha y hora: abajo, a la derecha del minimapa -->
    <div class="clock"><svg class="ic ic--star"><use href="#i-star"/></svg><span id="date"></span><b id="clock">--:--</b></div>

    <!-- Micrófono (pma-voice): abajo al centro, a la izquierda de la barra rápida -->
    <div class="voice" id="voice">
      <span class="voice__mic"><svg class="ic"><use href="#i-mic"/></svg></span>
      <span class="voice__range"><i></i><i></i><i></i></span>
      <span class="voice__label" id="voice-label">Normal</span>
      <span class="px-kbd voice__key">N</span>
      <span class="voice__radio" id="radio"><svg class="ic"><use href="#i-radio"/></svg><b id="radio-ch"></b></span>
    </div>

    <!-- Vehículo -->
    <div class="car" id="car">
      <div class="car__street" id="street"></div>
      <div class="car__dial">
        <svg class="gauge" viewBox="0 0 200 120" aria-hidden="true">
          <defs>
            <linearGradient id="g-speed" x1="0" x2="1">
              <stop offset="0" stop-color="#5ce1ff"/><stop offset="1" stop-color="#ff4fd8"/>
            </linearGradient>
          </defs>
          <path class="gauge__track" d="M20 110 A80 80 0 0 1 180 110"/>
          <path class="gauge__fill" id="gauge" d="M20 110 A80 80 0 0 1 180 110"/>
        </svg>
        <div class="car__speed"><b id="speed">0</b><span id="unit">km/h</span></div>
      </div>
      <div class="car__row">
        <svg class="ic ic--fuel"><use href="#i-fuel"/></svg>
        <i class="car__fuel"><span id="fuel"></span></i>
        <svg class="ic flag" id="engine" aria-label="Motor"><use href="#i-engine"/></svg>
        <svg class="ic flag" id="belt" aria-label="Cinturón"><use href="#i-belt"/></svg>
        <svg class="ic flag" id="cruise" aria-label="Control de crucero"><use href="#i-cruise"/></svg>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
