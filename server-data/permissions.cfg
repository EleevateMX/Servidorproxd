# Permisos ACE de Próxima RP.
# Identifica tu cuenta con tu licencia (la ves en la consola al conectar) o tu id de Cfx.re.
# Ejemplo:  add_principal identifier.license:xxxxxxxxxxxxxxxxxxxx group.admin
#           add_principal identifier.fivem:1234567 group.admin

# Staff: puede editar props, crear anclas y gestionar partidas.
add_ace group.admin pxd.props.edit allow
add_ace group.admin pxd.gamemodes.admin allow
add_ace group.admin command allow
add_ace group.admin command.quit deny

# Pon aquí tu identificador:
#add_principal identifier.license:TU_LICENCIA group.admin

# Actualizador: puede refrescar y reiniciarse (ensure usa stop/start con sus permisos).
add_ace resource.pxd_updater command.refresh allow
add_ace resource.pxd_updater command.ensure allow
add_ace resource.pxd_updater command.stop allow
add_ace resource.pxd_updater command.start allow
add_ace group.admin pxd.update allow

# Actualizador: FXServer solo deja escribir en otro recurso con permiso explícito
# (solo vale en el arranque, desde un .cfg). Así pxd_update puede actualizar estos.
