# Permisos de Próxima RP (se añaden a los de Qbox).
# Staff: puede editar props, guardar anclas y gestionar partidas de modos de juego.
add_ace group.admin pxd.props.edit allow
add_ace group.admin pxd.gamemodes.admin allow
add_ace group.admin pxd.jobs.edit allow

# Actualizador: puede refrescar y reiniciarse (ensure usa stop/start con sus permisos).
add_ace resource.pxd_updater command.refresh allow
add_ace resource.pxd_updater command.ensure allow
add_ace resource.pxd_updater command.stop allow
add_ace resource.pxd_updater command.start allow
add_ace group.admin pxd.update allow
add_ace group.admin pxd.chat.announce allow

# Actualizador: FXServer solo deja escribir en otro recurso con permiso explícito
# (solo vale en el arranque, desde un .cfg). Así pxd_update puede actualizar estos.
add_filesystem_permission pxd_updater write pxd_loadscreen
add_filesystem_permission pxd_updater write pxd_login
add_filesystem_permission pxd_updater write pxd_props
add_filesystem_permission pxd_updater write pxd_gamemodes
add_filesystem_permission pxd_updater write pxd_progress
add_filesystem_permission pxd_updater write pxd_restart
add_filesystem_permission pxd_updater write pxd_jobs
add_filesystem_permission pxd_updater write pxd_panel
add_filesystem_permission pxd_updater write pxd_multichar
add_filesystem_permission pxd_updater write pxd_hud
add_filesystem_permission pxd_updater write pxd_interact
add_filesystem_permission pxd_updater write qbx_core
add_filesystem_permission pxd_updater write npwd
add_filesystem_permission pxd_updater write pxd_chat
add_filesystem_permission pxd_updater write illenium-appearance
