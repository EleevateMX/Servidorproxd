# Staff: soporte, reportes, panel F10 y /duty (docs/19).
add_ace group.admin pxd.admin allow
add_ace group.admin pxd.admin.all allow
add_ace group.admin pxd.chat.announce allow
add_filesystem_permission pxd_updater write pxd_chat
add_filesystem_permission pxd_updater write illenium-appearance

# Multas (docs/30): gestionar (cancelar/corregir) y consultar.
add_ace group.admin pxd.justice.manage allow
add_ace group.admin pxd.justice.view allow
# Economía (docs/35): cancelar cualquier factura y ver el resumen /economia
add_ace group.admin pxd.economy.manage allow
