# Receta de txAdmin: PRÓXIMA RP + QBOX (fase 1, rol completo con base de datos).
# En txAdmin → «Remote URL Template» pega:
#   https://raw.githubusercontent.com/EleevateMX/Servidorproxd/HEAD/recipe-qbox.yaml
# Necesita MySQL/MariaDB (Nodecraft → Database te da los datos de conexión).
#
# Basada en la receta oficial «Qbox Lean» de Qbox-project/txAdminRecipe
# (qbox-lean.yaml, commit 0a12aa7c3e023b9d22264db4fb200d5183321b56, 21-oct-2026). Cambios:
#   - sin la pantalla de carga de D4isDAVID ni myLogo.png (usamos pxd_loadscreen);
#   - server.cfg propio (server-data/server.qbox.cfg) + permissions.pxd.cfg;
#   - recursos [proxima] y arte de la marca (Kling) descargados;
#   - ox_lib en español;
#   - fase 2: trabajos y qbx_properties de la receta oficial completa (qbox.yaml) + pxd_jobs.
# Para actualizar: volver a partir de la receta oficial y repetir estos cambios.
$engine: 3
$onesync: on
name: Próxima RP + Qbox
author: Próxima RP (basada en Qbox Lean de The Community)
description: Próxima RP sobre Qbox Lean (qbx_core, ox, voz, teléfono, policía, EMS, concesionario, ayuntamiento) + trabajos (mecánico, grúa, taxi, camionero, basurero, autobús, periodista, minero, leñador, pescador, repartidor…) y casas con modos de juego, editor de props, login y pantalla de carga propios. HUD, panel (TAB) y selección de personaje propios. Requiere base de datos.

