name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalar Lua 5.4
        run: sudo apt-get update && sudo apt-get install -y lua5.4
      - name: Sintaxis Lua
        run: find server-data -name '*.lua' -print0 | xargs -0 -n1 luac5.4 -p
      - name: Sintaxis JS
        run: for f in $(find server-data tools scripts tests -name '*.js' -o -name '*.mjs'); do node --check "$f"; done
      - name: Pruebas
        run: npm test
